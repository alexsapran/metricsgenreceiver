resourceLogs:
  - resource:
      attributes:
        - key: k8s.cluster.name
          value:
            stringValue: "{{.RandomFrom `production-cluster` `staging-cluster`}}"
        - key: k8s.namespace.name
          value:
            stringValue: "{{.ModFrom .InstanceID `default` `cache`}}"
        - key: k8s.node.name
          value:
            stringValue: "node-{{.Mod .InstanceID 3}}"
        - key: k8s.pod.name
          value:
            stringValue: "redis-{{.RandomHex 10}}"
        - key: k8s.pod.uid
          value:
            stringValue: "{{.UUID}}"
        - key: k8s.container.name
          value:
            stringValue: "redis"
        - key: container.id
          value:
            stringValue: "{{.RandomHex 64}}"
        - key: container.image.name
          value:
            stringValue: "redis"
        - key: container.image.tag
          value:
            stringValue: "7.2.4"
        - key: service.name
          value:
            stringValue: "redis"
        - key: k8s.pod.label.app.kubernetes.io/name
          value:
            stringValue: "redis"
        - key: k8s.pod.label.app.kubernetes.io/instance
          value:
            stringValue: "redis"
        - key: k8s.pod.label.app.kubernetes.io/version
          value:
            stringValue: "7.2.4"
        - key: k8s.pod.label.app.kubernetes.io/component
          value:
            stringValue: "master"
        - key: k8s.pod.label.app.kubernetes.io/managed-by
          value:
            stringValue: "Helm"
        - key: k8s.pod.label.helm.sh/chart
          value:
            stringValue: "redis-20.6.2"
        - key: k8s.pod.label.app.kubernetes.io/part-of
          value:
            stringValue: "redis"
        - key: k8s.statefulset.name
          value:
            stringValue: "redis-master"
    scopeLogs:
      - scope:
          name: "log-generator"
        logRecords: []
