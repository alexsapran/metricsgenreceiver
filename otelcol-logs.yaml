receivers:
  metricsgen:
    start_now_minus: 1h
    interval: 5s
    interval_jitter_std_dev: 10ms
    real_time: false
    exit_after_end: true
    seed: 42
    log_scenarios:
      # Nginx ingress controller
      - path: builtin/k8s-nginx
        scale: 30                     # total pod instances = nodes * pods_per_node (3 * 10 = 30)
        logs_per_interval: 50         # log records emitted per pod per interval
        concurrency: 10               # parallel goroutines for generation throughput
        # diurnal_profile:            # optional: time-of-day volume shaping (peak 14:00, trough 04:00)
        #   peak_hour: 14
        #   trough_hour: 4
        #   peak_multiplier: 3.0
        #   trough_multiplier: 0.2
        #   cron_bursts:
        #     - interval: 15m
        #       multiplier: 5.0
        #       duration: 1m
        # severity_weights: [0, 2, 87, 94, 99, 100]  # optional override: [TRACE, DEBUG, INFO, WARN, ERROR, FATAL]
        #   Default [0, 2, 87, 94, 99, 100] → TRACE 0%, DEBUG 2%, INFO 85%, WARN 7%, ERROR 5%, FATAL 1%
        #   Example high-error: [0, 0, 50, 65, 90, 100] → INFO 50%, WARN 15%, ERROR 25%, FATAL 10%
        # ip_pool:                        # optional: tune the IP address pool for net.peer.ip
        #   cidrs: ["10.0.0.0/8"]         # CIDR ranges to draw from (default: ["10.0.0.0/8"])
        #   zipf_skew: 1.5               # Zipf s parameter >1.0 (default: 1.5); higher = fewer IPs dominate
        #   Pool size is auto-derived: scale * 10 (minimum 500), so scale=30 → 300 IPs
        template_vars:
          nodes: 3                    # number of k8s nodes (distinct k8s.node.name values)
        needles:
          - name: upstream_timeout
            message: "upstream timed out (110: Connection timed out) while connecting to upstream"
            rate: 0.002
            severity: ERROR
            attributes:
              error.type: "timeout"
              upstream.host: "backend-svc:8080"

      # MySQL database
      - path: builtin/k8s-mysql
        scale: 15                     # 3 nodes * 5 pods per node
        logs_per_interval: 20
        template_vars:
          nodes: 3
        needles:
          - name: deadlock
            message: "LATEST DETECTED DEADLOCK in transaction 0x7f2a1c003e80"
            rate: 0.001
            severity: FATAL
            attributes:
              db.statement: "UPDATE orders SET status='processing' WHERE id=42"
          - name: disk_full
            message: "No space left on device writing to /var/lib/mysql/ibdata1"
            rate: 0.0005
            severity: FATAL

      # Redis cache
      - path: builtin/k8s-redis
        scale: 15                     # 3 nodes * 5 pods per node
        logs_per_interval: 30
        template_vars:
          nodes: 3

      # Go microservices
      - path: builtin/k8s-goapp
        scale: 30                     # 3 nodes * 10 pods per node
        logs_per_interval: 40
        concurrency: 10
        template_vars:
          nodes: 3
        needles:
          - name: panic_recovery
            message: '{"level":"fatal","ts":"2025-01-01T00:00:00Z","caller":"main.go:42","msg":"panic recovered","error":"runtime error: index out of range [5] with length 3","stacktrace":"goroutine 1 [running]:\nmain.handleRequest()"}'
            rate: 0.0001
            severity: FATAL

#      # Simple log template (for testing)
#      - path: builtin/simple
#        scale: 5
#        logs_per_interval: 10

processors:
  batch:

extensions:
  pprof:

exporters:
  debug:
    verbosity: detailed
  file:
    path: ./file-exporter/logs-generated.json
  nop:
  elasticsearch:
    endpoints: [ https://localhost:9200 ]
    user: elastic
    password: changeme
    num_workers: 2
    sending_queue:
      enabled: false
    mapping:
      mode: otel
    tls:
      insecure_skip_verify: true

service:
#  extensions: [pprof]
  pipelines:
    logs:
      receivers: [metricsgen]
#      processors: [batch]
      exporters: [nop]
#      exporters: [elasticsearch] # do not use with batch processor. ES exporter is doing batching internally.
#      exporters: [debug]
#      exporters: [file]
