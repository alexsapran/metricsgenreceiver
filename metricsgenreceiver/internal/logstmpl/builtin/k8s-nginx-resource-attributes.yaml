resourceLogs:
  - resource:
      attributes:
        - key: k8s.cluster.name
          value:
            stringValue: "{{.RandomFrom `production-cluster` `staging-cluster`}}"
        - key: k8s.namespace.name
          value:
            stringValue: "{{.ModFrom .InstanceID `ingress-nginx` `default`}}"
        - key: k8s.node.name
          value:
            stringValue: "node-{{$nodes := 3}}{{if and .Vars .Vars.nodes}}{{$nodes = .Vars.nodes}}{{end}}{{.Mod .InstanceID $nodes}}"
        - key: k8s.pod.name
          value:
            stringValue: "nginx-{{.RandomHex 10}}"
        - key: k8s.pod.uid
          value:
            stringValue: "{{.UUID}}"
        - key: k8s.container.name
          value:
            stringValue: "nginx"
        - key: container.id
          value:
            stringValue: "{{.RandomHex 64}}"
        - key: container.image.name
          value:
            stringValue: "nginx"
        - key: container.image.tag
          value:
            stringValue: "1.25.3"
        - key: service.name
          value:
            stringValue: "nginx"
        - key: k8s.pod.label.app.kubernetes.io/name
          value:
            stringValue: "ingress-nginx"
        - key: k8s.pod.label.app.kubernetes.io/instance
          value:
            stringValue: "ingress-nginx"
        - key: k8s.pod.label.app.kubernetes.io/version
          value:
            stringValue: "1.25.3"
        - key: k8s.pod.label.app.kubernetes.io/component
          value:
            stringValue: "controller"
        - key: k8s.pod.label.app.kubernetes.io/managed-by
          value:
            stringValue: "Helm"
        - key: k8s.pod.label.helm.sh/chart
          value:
            stringValue: "ingress-nginx-4.11.3"
        - key: k8s.pod.label.app.kubernetes.io/part-of
          value:
            stringValue: "ingress-nginx"
        - key: k8s.replicaset.name
          value:
            stringValue: "nginx-controller-{{.RandomHex 10}}"
        - key: k8s.deployment.name
          value:
            stringValue: "ingress-nginx-controller"
    scopeLogs:
      - scope:
          name: "log-generator"
        logRecords: []
