receivers:
  metricsgen:
    start_now_minus: 1h
    interval: 5s
    interval_jitter_std_dev: 10ms
    real_time: false
    exit_after_end: true
    seed: 42
    log_scenarios:
      - path: builtin/k8s-nginx
        scale: 30
        logs_per_interval: 50
        concurrency: 10
        template_vars:
          nodes: 3

      - path: builtin/k8s-mysql
        scale: 15
        logs_per_interval: 20
        template_vars:
          nodes: 3

      - path: builtin/k8s-redis
        scale: 15
        logs_per_interval: 30
        template_vars:
          nodes: 3

      - path: builtin/k8s-goapp
        scale: 30
        logs_per_interval: 40
        concurrency: 10
        template_vars:
          nodes: 3

      - path: builtin/k8s-proxy
        scale: 24
        logs_per_interval: 35
        concurrency: 8
        emit_trace_context: true
        template_vars:
          nodes: 3

exporters:
  nop:

service:
  pipelines:
    logs:
      receivers: [metricsgen]
      exporters: [nop]
