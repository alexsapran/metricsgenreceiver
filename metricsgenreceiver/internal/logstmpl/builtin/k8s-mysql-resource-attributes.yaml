resourceLogs:
  - resource:
      attributes:
        - key: k8s.cluster.name
          value:
            stringValue: "{{.RandomFrom `production-cluster` `staging-cluster`}}"
        - key: k8s.namespace.name
          value:
            stringValue: "{{.ModFrom .InstanceID `default` `data` `backend`}}"
        - key: k8s.node.name
          value:
            stringValue: "node-{{.Mod .InstanceID 3}}"
        - key: k8s.pod.name
          value:
            stringValue: "mysql-{{.RandomHex 10}}"
        - key: k8s.pod.uid
          value:
            stringValue: "{{.UUID}}"
        - key: k8s.container.name
          value:
            stringValue: "mysql"
        - key: container.id
          value:
            stringValue: "{{.RandomHex 64}}"
        - key: container.image.name
          value:
            stringValue: "mysql"
        - key: container.image.tag
          value:
            stringValue: "8.0.36"
        - key: service.name
          value:
            stringValue: "mysql"
    scopeLogs:
      - scope:
          name: "log-generator"
        logRecords: []
